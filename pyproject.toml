[project]
name = "gemini-mcp-server"
version = "0.1.0"
description = "Tiny MCP stdio server exposing a gemini_ask tool, with retries and model fallback"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2,<2"]

[project.scripts]
gemini-mcp-server = "gemini_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
